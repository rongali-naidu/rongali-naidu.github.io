projects:
  - slug: data-strategy-and-governance
    title: Data Strategy & Governance
    summary: >
      The fundamentals that outlast every tech wave. A data strategy that ties business goals to
      people, architecture and technology, and a governance framework for security, privacy,
      quality and compliance.
    year: 2026
    status: Open notes · CC BY 4.0
    repo: https://github.com/rongali-naidu/data-governance
    image: data-strategy-framework.png
    image_alt: Data strategy framework. Business objectives drive analytics and AI, delivered through data architecture, data governance and technology, on a foundation of people and culture, with a measure-and-improve loop
    stack: [Data strategy, Data governance, Data security, Data privacy, Data quality, Compliance, Metadata and lineage]
    overview: |
      Tools change with every wave; the fundamentals don't. You still need the right **data
      strategy**, solid **data architecture**, strong **data governance**, and teams organized to
      map clearly to business goals. These notes capture both layers.

      **Data strategy** connects business objectives to the value created by analytics, BI, data
      science and AI, delivered through three capability pillars (data architecture, data
      governance, technology) on a foundation of people and data culture, with a
      measure-and-improve loop. It's cross-checked against AWS, Google Cloud and Databricks
      references.

      **Data architecture** is one of those pillars: how data is stored, moved and served, and how
      the architecture builds governance in. It summarizes my
      [Decluttering Data Architectures](https://github.com/rongali-naidu/decluttering-data-architectures)
      guide.

      **Data governance** is another: the decision rights and accountability for
      data. It covers three pillars (security, privacy and quality), wrapped by compliance and
      audit, on a foundation of ownership, policies, and metadata and lineage.

      ![Data governance framework: compliance and audit wrapping data security, privacy and quality, on a foundation of ownership, policies and metadata](/static/projects/data-governance-framework.png)

      The **data quality** section goes deepest: why DQ frameworks replaced database constraints
      in cloud lakes and warehouses, DQ dimensions, shift-left checks, data profiling with a
      generic results schema, DQ scoring and certification, ownership, and a DQ tool evaluation
      matrix.
    how_it_works:
      - "Business objectives decide which value to create and set the target data maturity."
      - "Analytics, BI, data science and AI are where data creates that value."
      - "Data architecture, data governance and technology deliver it, on a foundation of people, structure and data literacy."
      - "Governance keeps data protected (security), used only as authorized (privacy) and fit for purpose (quality), and compliance proves it."
      - "KPIs, a roadmap and periodic reviews feed back into the business objectives."
    highlights:
      - title: Data strategy
        text: Essence, layered framework, eight components, maturity stages, operating models and KPIs.
      - title: Data architecture
        text: Components, layer names across vendors, the decluttered map, design principles and governance by design.
      - title: Governance framework
        text: Security, privacy and quality pillars, wrapped by compliance, on ownership, policies and metadata.
      - title: Data quality in depth
        text: From database constraints to Deequ-style frameworks, with dimensions, checks and scoring.
      - title: Data profiling
        text: Metrics to collect and a platform-agnostic schema for storing profiling results.
      - title: DQ tool evaluation
        text: Deequ, Glue Data Quality, Airflow, dbt, Great Expectations and OpenMetadata, scored against 38 criteria.
    links:
      - { label: Data strategy, url: "https://github.com/rongali-naidu/data-governance/tree/main/00-data-strategy" }
      - { label: Data architecture, url: "https://github.com/rongali-naidu/data-governance/tree/main/05-data-architecture" }
      - { label: Data governance, url: "https://github.com/rongali-naidu/data-governance#readme" }
      - { label: Data quality, url: "https://github.com/rongali-naidu/data-governance/tree/main/04-data-quality" }
      - { label: View repository, url: "https://github.com/rongali-naidu/data-governance" }

  - slug: semantic-architecture-for-ai-agents
    title: Semantic Architecture for AI Agents
    summary: >
      Right context in, right answer out. A hands-on reference for the semantic layer that
      gives AI data agents the meaning behind the data: six dimensions, one retail example.
    year: 2026
    status: Open source
    repo: https://github.com/rongali-naidu/semantic-architecture-for-ai-agents
    image: semantic-architecture-for-ai-agents.png
    image_alt: An agent is a model plus a harness; the semantic layer sits outside the agent and feeds prompt, context and harness engineering
    stack: [Semantic layer, Ontologies, Knowledge graphs, Metadata, Lineage, Data agents]
    overview: |
      **Garbage in, garbage out** applies not just to data, but equally to the context behind
      data agents. An LLM can write SQL, but on its own it doesn't know what *your* business
      means: which of five "revenue" columns is the right one, that "client" and "customer" are
      the same thing, or how tables join without double counting. So it gives fluent, confident,
      wrong answers.

      That missing context lives in a **semantic layer**: the shared meaning of an
      organization's data, used by AI agents and people alike. **Semantic architecture** is how
      that layer is designed. This project is a hands-on reference for it, from first principles
      to products, built on one retail example in every format and checked in CI.

      It's published as a web portal that also includes my
      [Ontology Basics](/projects/ontology-basics/) course, so the concepts and the hands-on
      practice sit side by side.
    how_it_works:
      - "An agent is a model plus a harness: the model is skilful but knows nothing about your data."
      - "The semantic layer sits outside the agent and feeds every part of the harness: vocabulary for prompts, meaning for context, a metric API for tools."
      - "Each of the six dimensions supplies one missing piece of context."
      - "The dimensions are linked in a graph, so the agent follows stored links instead of guessing at answer time."
      - "Lineage gives every answer its provenance, and verified answers flow back into the knowledge base."
    highlights:
      - title: Metadata
        text: Descriptions, valid values, owners, classification, quality and contracts.
      - title: Semantic models
        text: Governed metrics, dimensions and joins, defined once and compiled to SQL.
      - title: Knowledge bases
        text: Policies, guides and a vault of verified SQL.
      - title: Ontology & taxonomy
        text: What things are and how they relate.
      - title: Knowledge graphs
        text: The data graph of entities, and the semantic graph that links all the dimensions.
      - title: Lineage
        text: Where a number came from, and what breaks if a source changes.
    links:
      - { label: Open the portal, url: "https://rongali-naidu.github.io/semantic-architecture-for-ai-agents/" }
      - { label: View repository, url: "https://github.com/rongali-naidu/semantic-architecture-for-ai-agents" }
      - { label: Ontology Basics course, url: "https://rongali-naidu.github.io/semantic-architecture-for-ai-agents/learn/" }

  - slug: ontology-basics
    title: Ontology Basics
    summary: >
      A free, interactive course on RDF, RDFS, OWL, SHACL, SKOS, SPARQL and openCypher. Read a
      lesson on the left, edit data and run queries on the right, all in your browser.
    year: 2026
    status: Open source · Apache-2.0
    repo: https://github.com/rongali-naidu/ontology-basics
    image: ontology-basics.png
    image_alt: A lesson on SPARQL join patterns with the data editor, query editor and results side by side
    stack: [RDF / Turtle, SPARQL, OWL, SHACL, SKOS, openCypher]
    overview: |
      A hands-on course for learning ontologies by doing. Each page has the lesson on the left;
      on the right, the data at the top, a query in the middle and the results below. Edit
      anything and press **Run**. A **Graph** tab draws the data as a graph.

      Everything runs in the browser, with no server and no install: an
      [Oxigraph](https://github.com/oxigraph/oxigraph) RDF store compiled to WebAssembly,
      reasoning rules for RDFS and OWL, SHACL validation, and a teaching subset of openCypher for
      the property-graph lessons. Every lesson uses the same retail example as
      [Semantic Architecture for AI Agents](/projects/semantic-architecture-for-ai-agents/).
    how_it_works:
      - "Concepts first: what an ontology is, classes, properties, restrictions, and how taxonomies, ontologies and knowledge graphs differ."
      - "RDF and Turtle, then SPARQL: patterns, joins, filters, aggregates, paths and updates, compared with SQL and Cypher."
      - "Property graphs with openCypher, Neo4j-style, on the same data."
      - "RDFS and OWL with reasoning you can switch on and off to see what gets inferred."
      - "SKOS for vocabularies, and SHACL for validating data, ending with a capstone exercise."
    highlights:
      - title: Learn by running
        text: 40 exercises with checks that tell you when your query is right, plus friendly explanations of common errors.
      - title: See what reasoning adds
        text: Turn RDFS or OWL reasoning on and see the inferred triples in the results and the graph.
      - title: RDF and property graphs
        text: SPARQL and openCypher on the same retail data, so the differences are concrete.
      - title: Nothing to install
        text: A static site on GitHub Pages; your progress and edits stay in your browser.
    links:
      - { label: Start the course, url: "https://rongali-naidu.github.io/ontology-basics/" }
      - { label: View repository, url: "https://github.com/rongali-naidu/ontology-basics" }

  - slug: ai-data-discovery-agent
    title: AI Data Discovery Agent
    summary: >
      Ask questions about your data lake in plain English: find datasets, understand what
      fields mean, and generate SQL, grounded in your own catalog metadata and query history.
    year: 2025
    status: Open source · MIT
    repo: https://github.com/rongali-naidu/ai-data-discovery-agent
    image: ai-data-discovery-agent.gif
    image_alt: Architecture of the AI Data Discovery Agent built on Amazon Quick Suite
    stack: [AWS Glue Data Catalog, Amazon Athena, Amazon S3, AWS Lambda, Amazon Quick Suite, LLMs / RAG, Python]
    overview: |
      An AI-powered data discovery and SQL generation agent built on **Amazon Quick Suite**.
      A Lambda function extracts fine-grained metadata from the AWS Glue Data Catalog and saved
      queries from Athena, stores them as JSON documents in S3, and Quick Suite ingests them as a
      knowledge base. A chat agent then uses that context to help people discover datasets,
      understand the business meaning of fields, and generate accurate SQL.

      It builds on my AWS Big Data Blog post from October 2024, which showed that rich,
      high-quality metadata is critical for accurate text-to-SQL. Since then, managed services
      have made knowledge bases and chat agents far simpler to build, and this project tests how
      far a managed approach goes compared with building agents and knowledge bases from scratch.
    how_it_works:
      - A user asks a question in plain English.
      - Relevant context (table metadata and sample SQL) is retrieved from the knowledge base.
      - The context and prompt instructions are sent to the LLM.
      - The LLM answers, whether that's clarifying the data, describing a table, or writing SQL.
      - The response is returned to the user in the chat agent or browser extension.
    highlights:
      - title: Automated metadata extraction
        text: Walks the Glue Data Catalog and captures tables, columns, partitions, descriptions and view SQL as structured JSON.
      - title: Real query history as context
        text: Collects saved queries from every Athena workgroup and links them to their tables, so generated SQL follows patterns your team already uses.
      - title: RAG-ready knowledge base
        text: Metadata documents land in S3 and are ingested into Quick Suite knowledge bases for semantic retrieval.
      - title: Chat agent in the browser
        text: A Quick Suite agent with a sample prompt template, plus the browser extension for end-user access.
      - title: Cross-account ready
        text: The extractor assumes an IAM role through STS, with an example IAM policy to adapt to your environment.
    links:
      - { label: View repository, url: "https://github.com/rongali-naidu/ai-data-discovery-agent" }
      - { label: "AWS blog: Enriching metadata for text-to-SQL", url: "https://aws.amazon.com/blogs/big-data/enriching-metadata-for-accurate-text-to-sql-generation-for-amazon-athena" }
      - { label: "LinkedIn: What it takes to call data AI-ready", url: "https://www.linkedin.com/pulse/what-takes-call-ai-ready-naidu-rongali-mgfwc/" }

# About page (Markdown).
about: |
  I currently work as an **AI Engineer**, building agentic solutions that enable data discovery
  and data analysis. My focus is creating a semantic layer from knowledge graphs, ontology
  artifacts, and enriched metadata that covers business glossaries and metric definitions, so
  that AI agents understand what the data actually means.

  At heart I'm a data engineer. Over the years I've also worked as a BI engineer, a database
  engineer and in MLOps, but data engineering is how I identify myself.

  Over the past twenty years, I've had a front-row seat to every major shift in this field. I
  started in the days of OLTP versus OLAP debates, moved through the scaling challenges of large
  RAC clusters, then into the rise of big data frameworks, and later the shift to data lakes and
  modern cloud architecture. Now I'm deep in the AI wave.

  Here's what I've learned through all of that change: the tools and technologies keep evolving,
  but the fundamentals don't. You still need the right **data strategy**, solid **data
  architecture**, strong **data governance**, and teams organized in a way that maps clearly to
  business goals. That's been true in every single wave, and it's exactly where my focus is today.

  Thanks to AI, hands-on coding is no longer the time sink it used to be. So I've stayed close to
  low-level design and I still write code myself. It keeps my thinking sharp and grounded in
  reality, while my main focus stays on strategy, architecture and governance.

  ## My journey

  My career started in 2004 at Cognizant, working on data warehousing projects in a hybrid role
  that covered both ETL and BI engineering. Ralph Kimball's books were my foundation. I then
  worked with clients in logistics, manufacturing and retail, and later at product companies: at
  **Oracle** on analytical solutions in the Oracle Fusion ERP suite, and at **Amazon** on data
  ranging from terabytes to petabytes. Over the years the work moved from data warehouses to
  data lakehouses and feature stores.

  Along the way I was granted a **US patent** for a solution that efficiently processes
  high-volume data, designed before the Hadoop era.

  ![Amazon patent award](/images/patent.jpg)

  ## What I work with today

  - **Lakehouse on AWS:** S3, Glue, Lake Formation, Redshift
  - **Table formats:** Apache Iceberg, S3 Tables
  - **Processing:** Athena, Spark (PySpark), DuckDB, Polars
  - **Ingestion and streaming:** AWS DMS (CDC), Kinesis, Firehose, Kafka, Flink
  - **GenAI:** agents and MCP, Amazon Bedrock, RAG, embeddings and vector search
  - **Semantic layer:** knowledge graphs, ontologies, business glossaries, metric definitions
  - **Databases:** PostgreSQL, Redshift
  - **Languages and tooling:** SQL, Python, AWS CDK

  ## Where I started

  Tools from my data warehousing years:

  - **ETL:** Informatica, SSIS, DataStage, OWB, ODI, PL/SQL
  - **Reporting and BI:** OBIEE, Cognos, Essbase, SSRS
  - **Databases:** Oracle, SQL Server

  ## Why this site

  I write these posts mainly to summarize what I've learned, for my own future reference, and to
  share it with anyone who's interested. Working in tech means continuously learning and
  unlearning as the stack changes, and having these recorded versions helps me quickly connect
  back to what I learned before.
